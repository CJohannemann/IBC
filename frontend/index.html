<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/src/assets/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Independence Baseball Club</title>
    <!-- What this site is, in the one place a filter or link preview reads it
         from. Copy matches the homepage hero so there isn't a second
         description drifting from the first. -->
    <meta
      name="description"
      content="Independence Baseball Club: developing confident athletes, strong leaders, and outstanding teammates in Northern Kentucky."
    />
    <meta property="og:title" content="Independence Baseball Club" />
    <meta
      property="og:description"
      content="Developing confident athletes, strong leaders, and outstanding teammates in Northern Kentucky."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://independencebaseballclub.com/" />
    <!-- SPA redirect from 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
