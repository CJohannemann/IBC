<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split the Pot - Independence Baseball Club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
            background-color: #f5f1e8;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px 10px 0 0;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .club-name {
            color: white;
            text-transform: uppercase;
        }

        .club-name h1 {
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .club-name .subtitle {
            color: #ef4444;
            font-size: 20px;
            letter-spacing: 3px;
        }

        .event-info {
            text-align: right;
            color: white;
        }

        .event-info .title {
            color: #ef4444;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .event-info .details {
            color: #93c5fd;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .content {
            background-color: #f5f1e8;
            padding: 30px;
        }

        .current-pot {
            background-color: white;
            border: 5px solid #1e3a8a;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .current-pot .label {
            color: #1e3a8a;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .current-pot .label::before {
            content: "🎲";
            font-size: 32px;
        }

        .current-pot .amount {
            color: #ef4444;
            font-size: 96px;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 3px 3px 8px rgba(239, 68, 68, 0.3);
            margin: 20px 0;
        }

        .current-pot .live-tally {
            color: #60a5fa;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .split-boxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .split-box {
            background-color: white;
            border: 5px solid #1e3a8a;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .split-box .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .split-box .label {
            color: #1e3a8a;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .split-box .percentage {
            color: #1e3a8a;
            font-size: 18px;
        }

        .split-box .amount {
            color: #f97316;
            font-size: 48px;
            font-weight: 900;
            margin-top: 10px;
        }

        .quick-add {
            background-color: white;
            border: 5px solid #1e3a8a;
            border-radius: 15px;
            padding: 30px;
        }

        .quick-add .section-title {
            color: #1e3a8a;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quick-add .section-title::before {
            content: "➕";
            color: #ef4444;
            font-size: 28px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 25px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        .add-button:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(239, 68, 68, 0.4);
        }

        .add-button:active {
            transform: translateY(0);
        }

        .custom-section {
            display: flex;
            gap: 15px;
        }

        .custom-input {
            flex: 1;
            padding: 20px;
            font-size: 20px;
            border: 3px solid #1e3a8a;
            border-radius: 10px;
            font-weight: bold;
            color: #9ca3af;
        }

        .add-final-button {
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-final-button:hover {
            background-color: #1e40af;
        }

        .add-final-button::before {
            content: "✓";
            font-size: 28px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .logo {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .club-name h1 {
                font-size: 24px;
            }

            .club-name .subtitle {
                font-size: 16px;
            }

            .event-info {
                text-align: center;
                margin-top: 15px;
            }

            .event-info .title {
                font-size: 20px;
            }

            .event-info .details {
                font-size: 12px;
            }

            .content {
                padding: 15px;
            }

            .current-pot {
                padding: 25px;
            }

            .current-pot .label {
                font-size: 20px;
            }

            .current-pot .amount {
                font-size: 56px;
            }

            .current-pot .live-tally {
                font-size: 12px;
            }

            .split-boxes {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .split-box {
                padding: 20px;
            }

            .split-box .label {
                font-size: 18px;
            }

            .split-box .amount {
                font-size: 36px;
            }

            .quick-add {
                padding: 20px;
            }

            .quick-add .section-title {
                font-size: 18px;
            }

            .add-button {
                padding: 20px;
                font-size: 28px;
            }

            .custom-section {
                flex-direction: column;
            }

            .custom-input {
                padding: 15px;
                font-size: 18px;
            }

            .add-final-button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="header">
        <div class="logo-section">
            <div class="logo">⚾</div>
            <div class="club-name">
                <h1>Independence</h1>
                <div class="subtitle">Baseball Club</div>
            </div>
        </div>
        <div class="event-info">
            <div class="title">SPLIT THE POT</div>
            <div class="details">KENTON COUNTY FAIR • JULY 14-18</div>
        </div>
    </div>

    <div class="content">
        <div class="current-pot">
            <div class="label">CURRENT POT</div>
            <div class="amount" id="totalPot">$0</div>
            <div class="live-tally">LIVE TALLY • UPDATES INSTANTLY</div>
        </div>

        <div class="split-boxes">
            <div class="split-box">
                <div class="icon">🏆</div>
                <div class="label">WINNER GETS</div>
                <div class="percentage">(50%)</div>
                <div class="amount" id="winnerAmount">$0</div>
            </div>
            <div class="split-box">
                <div class="icon">🤝</div>
                <div class="label">CLUB KEEPS</div>
                <div class="percentage">(50%)</div>
                <div class="amount" id="clubAmount">$0</div>
            </div>
        </div>

        <div class="quick-add">
            <div class="section-title">QUICK ADD TICKET SALES</div>
            <div class="button-grid">
                <button class="add-button" data-amount="5">+ $5</button>
                <button class="add-button" data-amount="10">+ $10</button>
                <button class="add-button" data-amount="20">+ $20</button>
                <button class="add-button" data-amount="50">+ $50</button>
            </div>
            <div class="custom-section">
                <input type="number" class="custom-input" id="customAmount" placeholder="Custom amount" min="0" step="0.01">
                <button class="add-final-button" id="addCustomBtn">ADD</button>
            </div>
        </div>
    </div>

    <script>
        let currentTotal = 0;

        function updateDisplay() {
            const halfAmount = currentTotal / 2;
            
            document.getElementById('totalPot').textContent = `$${currentTotal.toFixed(2)}`;
            document.getElementById('winnerAmount').textContent = `$${halfAmount.toFixed(2)}`;
            document.getElementById('clubAmount').textContent = `$${halfAmount.toFixed(2)}`;
        }

        function addToPot(amount) {
            currentTotal += amount;
            updateDisplay();
            animateUpdate();
        }

        function addCustomAmount() {
            const input = document.getElementById('customAmount');
            const amount = parseFloat(input.value);
            
            if (amount && amount > 0) {
                currentTotal += amount;
                updateDisplay();
                animateUpdate();
                input.value = '';
            }
        }

        function animateUpdate() {
            const potElement = document.getElementById('totalPot');
            const winnerElement = document.getElementById('winnerAmount');
            const clubElement = document.getElementById('clubAmount');
            
            potElement.style.transform = 'scale(1.1)';
            winnerElement.style.transform = 'scale(1.1)';
            clubElement.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                potElement.style.transform = 'scale(1)';
                winnerElement.style.transform = 'scale(1)';
                clubElement.style.transform = 'scale(1)';
            }, 200);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Add click handlers to quick add buttons
            const quickButtons = document.querySelectorAll('.add-button');
            quickButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const amount = parseFloat(this.getAttribute('data-amount'));
                    addToPot(amount);
                });
            });

            // Add click handler to custom add button
            document.getElementById('addCustomBtn').addEventListener('click', function(e) {
                e.preventDefault();
                addCustomAmount();
            });

            // Add enter key handler to custom input
            document.getElementById('customAmount').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addCustomAmount();
                }
            });

            // Add transition effects
            document.getElementById('totalPot').style.transition = 'transform 0.2s ease';
            document.getElementById('winnerAmount').style.transition = 'transform 0.2s ease';
            document.getElementById('clubAmount').style.transition = 'transform 0.2s ease';
        });
    </script>
    </div>
</body>
</html>
